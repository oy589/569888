<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>官方服务中心</title>
<style>
*{
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
body {
  min-height: 100vh;
  background-color: #0c0c0c;
  background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
  linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size: 30px 30px;
  font-family: "Microsoft YaHei",PingFang SC,sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding:20px;
}
.wrap{
  width: 100%;
  max-width: 560px;
}
.top-card{
  background-color:#18140e;
  border:1px solid #3a3324;
  border-radius:16px;
  padding:32px 26px;
  text-align:center;
  margin-bottom:16px;
}
.top-tag{
  font-size:14px;
  color:#d4bc84;
  letter-spacing:1px;
  border:1px solid #d4bc8470;
  display:inline-block;
  padding:4px 14px;
  border-radius:20px;
  margin-bottom:12px;
}
.top-card h1{
  font-size:32px;
  color:#e6cd90;
  font-weight:normal;
  letter-spacing:2px;
  margin-bottom:8px;
}
.top-card .desc-text{
  color:#b8a882;
  font-size:14px;
  line-height:1.7;
}

.main-card{
  background-color:#18140e;
  border:1px solid #3a3324;
  border-radius:16px;
  padding:26px;
}
.download-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 0;
}
.download-row:not(:last-child){
  border-bottom: 1px solid #2c271e;
}
.left-group{
  display:flex;
  align-items:center;
  gap:12px;
}
.icon-box img{
  width:32px;
  height:32px;
  object-fit:contain;
  border-radius:6px;
}
.text-name{
  color:#e2d3ad;
  font-size:16px;
}
.gold-btn{
  padding:8px 22px;
  background:linear-gradient(180deg,#c9b278,#998450);
  color:#000;
  border:none;
  border-radius:24px;
  font-size:14px;
  text-decoration:none;
  font-weight:500;
  white-space:nowrap;
}
.gold-btn:hover{
  filter: brightness(1.15);
}
.bottom-tips{
  text-align:center;
  margin-top:20px;
  color:#887c64;
  font-size:12px;
}

/* 弹窗样式 */
.popup-mask{
  position: fixed;
  inset:0;
  background:rgba(0,0,0,0.75);
  backdrop-filter: blur(6px);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:999;
}
.popup-box{
  width:90%;
  max-width:480px;
  background:#121212;
  border:1px solid #d4bc84;
  border-radius:20px;
  padding:44px 32px;
  text-align:center;
}
.popup-line{
  width:70px;
  height:2px;
  background:#d4bc84;
  margin:0 auto 20px;
}
.popup-box h2{
  color:#e6cd90;
  font-size:32px;
  margin-bottom:20px;
  letter-spacing:2px;
}
.popup-phone-row{
  margin:26px 0;
}
.popup-phone-text{
  color:#e6cd90;
  font-size:26px;
  line-height:1.6;
}
.popup-phone-text a{
  color:#e6cd90;
  text-decoration:none;
  border-bottom:2px solid #d4bc84;
  padding-bottom:3px;
  display:inline-block;
  cursor:pointer;
}
.popup-confirm{
  width:100%;
  margin-top:40px;
  padding:16px;
  border-radius:999px;
  border:none;
  background:linear-gradient(180deg,#c9b278,#a08b55);
  font-size:20px;
  color:#000000;
  cursor:pointer;
  font-weight:600;
}
.popup-confirm:hover{
  filter:brightness(1.1);
}
.tip-toast{
  position:fixed;
  left:50%;
  top:45%;
  transform:translate(-50%,-50%);
  background:rgba(0,0,0,0.75);
  color:#fff;
  padding:12px 24px;
  border-radius:8px;
  font-size:16px;
  display:none;
  z-index:1000;
}
/* 分隔标题，区分区块 */
.section-title{
  color:#d4bc84;
  text-align:center;
  padding:12px 0 8px;
  font-size:15px;
  letter-spacing:1px;
}
</style>
</head>
<body>

<script>
function closePopup(){
  document.getElementById('popup').style.display = 'none';
}
function copyText(text){
  navigator.clipboard.writeText(text).then(()=>{
    const toast = document.getElementById('toast');
    toast.style.display='block';
    setTimeout(()=>toast.style.display='none',1500);
  })
}
</script>
