<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>官方服务中心</title>
<style>
*{
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent; /*清除苹果点击蓝色块*/
}
body {
  min-height: 100vh;
  background-color: #0c0c0c;
  background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
  linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size: 30px 30px;
  font-family: "Microsoft YaHei",PingFang SC,sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding:20px;
}
.wrap{
  width: 100%;
  max-width: 560px;
}
.top-card{
  background-color: #18140e;
  border:1px solid #3a3324;
  border-radius:16px;
  padding:30px 20px;
  text-align:center;
  margin-bottom:20px;
}
.top-tag{
  font-size:14px;
  color:#d4bc84;
  letter-spacing:1px;
  border:1px solid #d4bc8470;
  display:inline-block;
  padding:4px 14px;
  border-radius:20px;
  margin-bottom:12px;
}
.top-card h1{
  font-size:32px;
  color:#e6cd90;
  font-weight:normal;
  letter-spacing:2px;
}
.top-card p{
  color:#b8a882;
  font-size:14px;
  line-height:1.7;
  margin-top:8px;
}
.main-card{
  background-color:#18140e;
  border:1px solid #3a3324;
  border-radius:16px;
  padding:30px 26px;
}
.download-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 0;
}
.download-row:not(:last-child){
  border-bottom: 1px solid #2c271e;
}
.left-group{
  display:flex;
  align-items:center;
  gap:12px;
}
.icon-box img{
  width:32px;
  height:32px;
  object-fit:contain;
  border-radius:6px;
}
.text-name{
  color:#e2d3ad;
  font-size:16px;
}
.gold-btn{
  padding:8px 22px;
  background:linear-gradient(180deg,#c9b278,#998450);
  color:#000;
  border:none;
  border-radius:24px;
  font-size:14px;
  text-decoration:none;
  font-weight:500;
  white-space:nowrap;
}
.gold-btn:hover{
  filter: brightness(1.15);
}
.bottom-tips{
  text-align:center;
  margin-top:24px;
  color:#887c64;
  font-size:12px;
}

/* 弹窗样式，匹配你手机截图布局 */
.popup-mask{
  position: fixed;
  inset:0;
  background:rgba(0,0,0,0.75);
  backdrop-filter: blur(6px);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:999;
}
.popup-box{
  width:90%;
  max-width:480px;
  background:#121212;
  border:1px solid #d4bc84;
  border-radius:20px;
  padding:44px 32px;
  text-align:center;
}
.popup-line{
  width:70px;
  height:2px;
  background:#d4bc84;
  margin:0 auto 20px;
}
.popup-box h2{
  color:#e6cd90;
  font-size:32px;
  margin-bottom:20px;
  letter-spacing:2px;
}
.popup-desc{
  color:#e6cd90;
  font-size:18px;
  line-height:1.8;
  margin-bottom:30px;
}
.popup-phone-row{
  margin:26px 0;
}
.popup-phone-text{
  color:#e6cd90;
  font-size:26px;
  line-height:1.6;
}
/* 重点：纯净a标签样式，无任何事件干扰 */
.popup-phone-text a{
  color:#e6cd90;
  text-decoration:none;
  border-bottom:2px solid #d4bc84;
  padding-bottom:3px;
  display:inline-block;
  cursor:pointer;
}
.popup-confirm{
  width:100%;
  margin-top:40px;
  padding:16px;
  border-radius:999px;
  border:none;
  background:linear-gradient(180deg,#c9b278,#a08b55);
  font-size:20px;
  color:#000000;
  cursor:pointer;
  font-weight:600;
}
.popup-confirm:hover{
  filter:brightness(1.1);
}
/* 复制提示备用 */
.tip-toast{
  position:fixed;
  left:50%;
  top:45%;
  transform:translate(-50%,-50%);
  background:rgba(0,0,0,0.75);
  color:#fff;
  padding:12px 24px;
  border-radius:8px;
  font-size:16px;
  display:none;
  z-index:1000;
}
</style>
</head>
<body>
<div class="tip-toast" id="toast">号码已复制</div>
<!-- 弹窗【关键改动】：a标签只保留href，删除所有onclick、ontouchstart！ -->
<div class="popup-mask" id="popup">
  <div class="popup-box">
    <div class="popup-line"></div>
    <h2>温馨提示</h2>
    <div class="popup-desc">
      本公司十年老品牌<br>
      投诉建议请认准官方联系方式
    </div>
    <div class="popup-phone-row popup-phone-text">
      客服欧信：<br>
      <a href="6668">6668</a>
    </div>
    <div class="popup-phone-row popup-phone-text">
      经理欧信：<br>
      <a href="7777">7777</a>
    </div>
    <button class="popup-confirm" onclick="closePopup()">进入服务中心</button>
  </div>
</div>

<div class="wrap">
  <div class="top-card">
    <div class="top-tag">OFFICIAL SERVICE</div>
    <h1>官方服务中心</h1>
    <p>请通过以下官方频道获取APP</p>
  </div>

  <div class="main-card">
    <div class="download-row">
      <div class="left-group">
        <div class="icon-box">
          <img src="bat.png">
        </div>
        <span class="text-name">蝙蝠APP下载</span>
      </div>
      <a href="https://batchat.com" target="_blank" class="gold-btn">立即下载</a>
    </div>

    <div class="download-row">
      <div class="left-group">
        <div class="icon-box">
          <img src="haiou2.png">
        </div>
        <span class="text-name">海鸥APP下载</span>
      </div>
      <a href="https://haiouchat.com" target="_blank" class="gold-btn">立即下载</a>
    </div>

    <div class="download-row">
      <div class="left-group">
        <div class="icon-box">
          <img src="ouxin.png">
        </div>
        <span class="text-name">欧信APP下载</span>
      </div>
      <a href="https://ox8.tulinsm.top" target="_blank" class="gold-btn">立即下载</a>
    </div>
  </div>

  <div class="bottom-tips">
    请认准官方服务渠道，谨防非官方联系方式。
  </div>
</div>

<script>
function closePopup(){
  document.getElementById('popup').style.display = 'none';
}
// 备用复制号码功能，暂时保留
function copyText(text){
  navigator.clipboard.writeText(text).then(()=>{
    const toast = document.getElementById('toast');
    toast.style.display='block';
    setTimeout(()=>toast.style.display='none',1500);
  })
}
</script>
</body>
</html>
